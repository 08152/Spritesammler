
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Million Coins</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090909;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 5px black;
    pointer-events: none;
    z-index: 5;
}

#startScreen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.8);
    color: white;
    z-index: 10;
    cursor: pointer;
}

#startScreen button {
    padding: 20px 55px;
    background: #dba52e;
    border: 2px solid #ffdf83;
    border-radius: 8px;
    color: #201500;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

#startScreen button:hover {
    background: #ffcf59;
}

#hud {
    position: fixed;
    top: 20px;
    left: 20px;
    color: white;
    font-size: 17px;
    text-shadow: 0 2px 5px black;
    pointer-events: none;
    z-index: 4;
}

#coinCount {
    color: #ffd35c;
    font-size: 25px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="startScreen">
    <button id="startButton">SPIEL STARTEN</button>
</div>

<div id="crosshair"></div>

<div id="hud">
    <div>COINS</div>
    <div id="coinCount">0</div>
</div>

<script type="module" src="game.js"></script>

</body>
</html>
