
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOID Engine</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;flex-direction:column;
 background:radial-gradient(ellipse at 50% 42%,#211a43,#090b10 65%);
 color:#f5f5fa;font-family:Segoe UI,Arial,sans-serif
}
header{
 height:65px;padding:0 28px;display:flex;align-items:center;
 justify-content:space-between;border-bottom:1px solid #ffffff12
}
.brand{font-weight:800;letter-spacing:3px}
.muted{color:#9294a7;font-size:12px}
main{flex:1;display:grid;place-items:center;padding:30px 18px}
.welcome{width:100%;max-width:430px;text-align:center}
h1{
 font-size:clamp(44px,10vw,76px);letter-spacing:-4px;
 margin:0 0 16px;font-weight:900;
 background:linear-gradient(120deg,#fff,#bdb1ff,#795cff);
 color:transparent;background-clip:text
}
.subtitle{font-size:12px;letter-spacing:3px;color:#9294a7;margin-bottom:45px}
.actions{display:grid;gap:14px}
button{
 display:flex;align-items:center;gap:15px;width:100%;padding:19px;
 color:white;text-align:left;cursor:pointer;font:inherit;
 background:#141620;border:1px solid #303141;border-radius:12px;
 transition:.2s
}
button:hover{border-color:#8065ff;background:#211c38;transform:translateY(-2px)}
button.primary{background:linear-gradient(120deg,#35266a,#211a3e);border-color:#7359db}
.icon{font-size:25px;width:34px;text-align:center}
.label{display:flex;flex-direction:column;gap:6px}
.label strong{font-size:14px}
.label small{font-size:11px;color:#a4a5b6}
.arrow{margin-left:auto;color:#aaa;font-size:22px}
.divider{font-size:10px;letter-spacing:3px;color:#666a7a;padding:5px}
footer{text-align:center;padding:18px;color:#666a7a;font-size:10px;letter-spacing:2px}
</style>
</head>
<body>
<header>
 <div class="brand">VOID <span style="color:#8065ff">ENGINE</span></div>
 <div class="muted">DEVELOPMENT EDITION</div>
</header>

<main>
 <section class="welcome">
  <h1>VOID ENGINE</h1>
  <p class="subtitle">YOUR WORLD. YOUR RULES.</p>

  <div class="actions">
   <button id="open">
    <span class="icon">↥</span>
    <span class="label">
     <strong>Bestehendes Projekt öffnen</strong>
     <small>Ein Projekt auswählen und weiterarbeiten</small>
    </span>
    <span class="arrow">›</span>
   </button>

   <input id="file" type="file" accept=".json,.void" hidden>

   <div class="divider">ODER</div>

   <button class="primary" id="create">
    <span class="icon">＋</span>
    <span class="label">
     <strong>Neues Projekt erstellen</strong>
     <small>Eine neue 3D-Welt beginnen</small>
    </span>
    <span class="arrow">›</span>
   </button>
  </div>
  <p class="muted" id="status" style="margin-top:25px">
   Bereit für dein nächstes Projekt.
  </p>
 </section>
</main>

<footer>VOID ENGINE · CREATE WITHOUT LIMITS</footer>

<script>
const file = document.getElementById("file");

document.getElementById("open").onclick = () => file.click();

file.onchange = () => {
 const selected = file.files[0];
 if (!selected) return;

 const reader = new FileReader();
 reader.onload = () => {
  try {
   const project = JSON.parse(reader.result);
   sessionStorage.setItem("voidProject", JSON.stringify(project));
   location.href = "editor.html";
  } catch {
   document.getElementById("status").textContent =
    "Diese Projektdatei ist ungültig.";
  }
 };
 reader.readAsText(selected);
};

document.getElementById("create").onclick = () => {
 const name = prompt("Wie soll dein Projekt heißen?");
 if (name === null || !name.trim()) return;

 const project = {
  engine: "VOID Engine",
  version: 1,
  name: name.trim(),
  scene: { name: "Level_01", objects: [] }
 };

 sessionStorage.setItem("voidProject", JSON.stringify(project));
 location.href = "editor.html";
};
</script>
</body>
</html>
