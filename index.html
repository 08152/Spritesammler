
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GHOST HUNT</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
:root{
  --bg:#080d19;
  --panel:rgba(12,21,42,.94);
  --blue:#399bff;
  --purple:#9c65ff;
  --text:#f3f6ff;
  --muted:#8795b3;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}
#map{
  position:fixed;
  inset:0;
  background:#101b2d;
  z-index:1;
}
.leaflet-tile{
  filter:brightness(.72) saturate(.75) hue-rotate(8deg);
}
.leaflet-control-attribution{
  font-size:9px!important;
}
#topbar{
  position:fixed;
  z-index:500;
  top:15px;
  left:15px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  border:1px solid #344a70;
  background:rgba(9,17,35,.91);
  border-radius:15px;
  box-shadow:0 5px 25px #0008;
  backdrop-filter:blur(12px);
}
.logo{
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
}
.logo span{color:#55aaff}
#gpsStatus{
  font-size:11px;
  color:#8fa4c7;
  margin-top:4px;
}
#locationButton{
  position:fixed;
  z-index:500;
  bottom:105px;
  left:15px;
  width:48px;
  height:48px;
  border:1px solid #344c75;
  border-radius:15px;
  background:var(--panel);
  color:white;
  font-size:21px;
  cursor:pointer;
}
#menu{
  position:fixed;
  z-index:600;
  right:14px;
  bottom:18px;
  display:flex;
  flex-direction:column;
  gap:9px;
  padding:9px;
  background:rgba(9,17,35,.94);
  border:1px solid #34466b;
  border-radius:19px;
  backdrop-filter:blur(15px);
  box-shadow:0 8px 35px #0008;
}
.nav{
  width:55px;
  height:55px;
  border:0;
  border-radius:13px;
  color:#a9b7d3;
  background:#182642;
  cursor:pointer;
  font-size:22px;
  transition:.2s;
}
.nav small{
  display:block;
  font-size:9px;
  margin-top:3px;
}
.nav.active{
  color:white;
  background:linear-gradient(135deg,#258df5,#8055ed);
  box-shadow:0 0 20px #398bff66;
  transform:scale(1.04);
}
#startScreen{
  position:fixed;
  inset:0;
  z-index:2000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(ellipse at 50% 35%,#183b71 0%,transparent 55%),
    #070c18;
}
.startCard{
  width:min(420px,100%);
  padding:35px 25px;
  text-align:center;
  border:1px solid #345a92;
  border-radius:26px;
  background:linear-gradient(145deg,#101d38,#0a1020);
  box-shadow:0 0 70px #267eff22;
}
.ghostLogo{
  font-size:75px;
  filter:drop-shadow(0 0 25px #539dff);
  animation:float 3s infinite ease-in-out;
}
@keyframes float{
  50%{transform:translateY(-12px)}
}
.startCard h1{
  font-size:34px;
  letter-spacing:4px;
  margin:12px 0 5px;
}
.startCard h1 span{color:#55aaff}
.startCard p{
  color:#9aabc9;
  line-height:1.6;
  font-size:13px;
}
.primary{
  width:100%;
  border:0;
  padding:16px;
  border-radius:13px;
  margin-top:17px;
  color:white;
  font-weight:bold;
  font-size:15px;
  background:linear-gradient(100deg,#248df4,#8055ed);
  cursor:pointer;
  box-shadow:0 5px 25px #398bff44;
  transition:.2s;
}
.primary:active{transform:scale(.96)}
#panel{
  display:none;
  position:fixed;
  z-index:550;
  inset:0;
  background:rgba(4,9,20,.72);
  backdrop-filter:blur(7px);
  align-items:center;
  justify-content:center;
  padding:18px;
}
.window{
  width:min(600px,100%);
  max-height:85vh;
  overflow:auto;
  padding:22px;
  background:linear-gradient(145deg,#111f3b,#0b1224);
  border:1px solid #38547e;
  border-radius:22px;
  box-shadow:0 20px 70px #000b;
  animation:appear .2s ease-out;
}
@keyframes appear{
  from{opacity:0;transform:translateY(15px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.windowHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.windowHeader h2{margin:0;font-size:21px}
.close{
  width:35px;
  height:35px;
  border:0;
  border-radius:10px;
  background:#263858;
  color:white;
  font-size:20px;
  cursor:pointer;
}
#collectionGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.card{
  position:relative;
  min-height:190px;
  overflow:hidden;
  border:1px solid #40577e;
  border-radius:16px;
  padding:13px;
  background:linear-gradient(145deg,#1c3155,#111b32);
  text-align:center;
  cursor:pointer;
  transition:.2s;
}
.card:active{transform:scale(.96)}
.cardArt{
  font-size:65px;
  margin:10px 0;
  filter:drop-shadow(0 0 15px #68aaff);
}
.cardName{font-weight:bold;font-size:14px}
.rarity{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
  background:#263c5e;
}
.common{color:#b8c4d8}
.uncommon{color:#55e7ad}
.rare{color:#53a9ff}
.epic{color:#c08aff}
.legendary{color:#ffd36c}
.mythic{color:#ff789e}
#empty{
  grid-column:1/-1;
  padding:45px 10px;
  text-align:center;
  color:#8292b0;
}
#ghostModal{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  background:#030817bb;
  backdrop-filter:blur(8px);
  align-items:center;
  justify-content:center;
  padding:20px;
}
.ghostWindow{
  width:min(370px,100%);
  padding:25px;
  text-align:center;
  border-radius:24px;
  background:linear-gradient(150deg,#172b50,#0b1225);
  border:1px solid #5682c0;
  box-shadow:0 0 50px #438bff33;
  animation:appear .2s;
}
.ghostArt{
  font-size:100px;
  margin:15px;
  filter:drop-shadow(0 0 25px #5baaff);
}
.ghostWindow h2{margin:5px}
.ghostWindow p{color:#a5b4d0;font-size:13px}
#distanceText{color:#75bcff!important}
#toast{
  position:fixed;
  z-index:3000;
  bottom:105px;
  left:50%;
  transform:translateX(-50%) translateY(15px);
  padding:12px 19px;
  border:1px solid #496a9d;
  border-radius:12px;
  background:#101e39;
  color:white;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
}
#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.playerMarker{
  width:19px;
  height:19px;
  border-radius:50%;
  background:#36a2ff;
  border:4px solid white;
  box-shadow:0 0 0 8px #399bff33,0 0 25px #399bff;
}
.ghostMarker{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:radial-gradient(circle,#6d55c8,#182a55);
  border:2px solid #a98cff;
  box-shadow:0 0 18px #9766ff99;
  font-size:23px;
  animation:float 2.5s infinite ease-in-out;
}
@media(max-width:500px){
  #topbar{top:10px;left:10px}
  .window{padding:17px}
  #menu{right:10px;bottom:12px}
}
</style>
</head>

<body>

<div id="map"></div>

<div id="topbar">
  <div>
    <div class="logo">👻 GHOST <span>HUNT</span></div>
    <div id="gpsStatus">Standort nicht aktiviert</div>
  </div>
</div>

<button id="locationButton" onclick="centerPlayer()">◎</button>

<div id="menu">
  <button class="nav active" id="mapNav" onclick="showPage('map')">
    🗺️<small>Karte</small>
  </button>
  <button class="nav" id="collectionNav" onclick="showPage('collection')">
    🃏<small>Sammlung</small>
  </button>
</div>

<div id="panel" onclick="if(event.target===this)closePanel()">
  <div class="window">
    <div class="windowHeader">
      <h2 id="panelTitle">Sammlung</h2>
      <button class="close" onclick="closePanel()">×</button>
    </div>
    <div id="collectionGrid"></div>
  </div>
</div>

<div id="ghostModal">
  <div class="ghostWindow">
    <div class="ghostArt" id="modalArt">👻</div>
    <h2 id="modalName">Geist</h2>
    <div class="rarity" id="modalRarity">Common</div>
    <p id="modalDescription"></p>
    <p id="distanceText"></p>
    <button class="primary" id="collectButton" onclick="collectGhost()">
      GEIST SAMMELN
    </button>
    <button class="close" style="width:100%;margin-top:10px"
      onclick="closeGhost()">Schließen</button>
  </div>
</div>

<div id="toast"></div>

<div id="startScreen">
  <div class="startCard">
    <div class="ghostLogo">👻</div>
    <h1>GHOST <span>HUNT</span></h1>
    <p>Entdecke geheimnisvolle Geister auf der Weltkarte.<br>
       Finde sie und vervollständige deine Sammlung!</p>
    <button class="primary" onclick="startGame()">SPIEL STARTEN</button>
    <p style="font-size:10px;margin-top:18px">
      GPS wird nur während der Nutzung abgefragt.<br>
      Bitte bleibe an sicheren, öffentlichen Orten.
    </p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ===================================
   GHOST HUNT
   =================================== */

const COLLECTION_KEY = "ghosthunt_collection_v1";

let cards = [];
let map;
let playerMarker = null;
let playerPosition = null;
let accuracyCircle = null;
let ghosts = [];
let selectedGhost = null;
let watchId = null;
let lastSpawnKey = "";
let currentPage = "map";

const rarityNames = {
  common:"Common",
  uncommon:"Uncommon",
  rare:"Rare",
  epic:"Epic",
  legendary:"Legendary",
  mythic:"Mythic"
};

const rarityClass = {
  Common:"common",
  Uncommon:"uncommon",
  Rare:"rare",
  Epic:"epic",
  Legendary:"legendary",
  Mythic:"mythic"
};

const rarityColors = {
  Common:"#b8c4d8",
  Uncommon:"#55e7ad",
  Rare:"#53a9ff",
  Epic:"#c08aff",
  Legendary:"#ffd36c",
  Mythic:"#ff789e"
};

function getCollection(){
  try{
    return JSON.parse(localStorage.getItem(COLLECTION_KEY)) || [];
  }catch(e){
    return [];
  }
}

function saveCollection(data){
  localStorage.setItem(COLLECTION_KEY,JSON.stringify(data));
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2500);
}

async function loadCards(){
  try{
    const response=await fetch("cards.json");
    if(!response.ok) throw new Error("cards.json nicht gefunden");
    const data=await response.json();
    if(!Array.isArray(data)||data.length===0) throw new Error("Keine Karten");
    cards=data;
    document.getElementById("gpsStatus").textContent="Kartendaten geladen";
  }catch(error){
    toast("Fehler: cards.json konnte nicht geladen werden");
    console.error(error);
    cards=[];
  }
}

function initMap(){
  map=L.map("map",{
    zoomControl:false,
    attributionControl:true
  }).setView([20,0],3);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }
  ).addTo(map);

  L.control.zoom({position:"topright"}).addTo(map);
}

async function startGame(){
  document.getElementById("startScreen").style.display="none";

  if(!map) initMap();

  await loadCards();

  if(cards.length===0){
    document.getElementById("gpsStatus").textContent="Kartendaten fehlen";
    return;
  }

  if(!navigator.geolocation){
    toast("GPS wird von diesem Browser nicht unterstützt");
    return;
  }

  document.getElementById("gpsStatus").textContent="GPS wird angefragt...";

  navigator.geolocation.getCurrentPosition(
    position=>{
      updatePosition(position);
      startWatching();
      toast("Standort erfolgreich aktiviert!");
    },
    error=>{
      document.getElementById("gpsStatus").textContent="GPS nicht verfügbar";
      toast("Standortfreigabe erforderlich");
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function startWatching(){
  if(watchId!==null) return;

  watchId=navigator.geolocation.watchPosition(
    updatePosition,
    error=>{
      console.warn(error);
      document.getElementById("gpsStatus").textContent="GPS-Signal verloren";
    },
    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:15000
    }
  );
}

function updatePosition(position){
  const lat=position.coords.latitude;
  const lng=position.coords.longitude;

  playerPosition={
    lat,
    lng,
    accuracy:position.coords.accuracy
  };

  document.getElementById("gpsStatus").textContent=
    "GPS aktiv · Genauigkeit ca. "+Math.round(position.coords.accuracy)+" m";

  if(!playerMarker){
    const icon=L.divIcon({
      className:"",
      html:'<div class="playerMarker"></div>',
      iconSize:[19,19],
      iconAnchor:[9,9]
    });

    playerMarker=L.marker([lat,lng],{
      icon,
      zIndexOffset:1000
    }).addTo(map);

    map.setView([lat,lng],17);
  }else{
    playerMarker.setLatLng([lat,lng]);
  }

  if(accuracyCircle){
    map.removeLayer(accuracyCircle);
  }

  accuracyCircle=L.circle([lat,lng],{
    radius:Math.min(position.coords.accuracy,100),
    color:"#399bff",
    weight:1,
    fillColor:"#399bff",
    fillOpacity:.06
  }).addTo(map);

  loadNearbyGhosts();
}

/* Zufällige Kartenwahl nach Spawnchance */
function weightedCard(){
  const total=cards.reduce((sum,c)=>sum+Math.max(0,Number(c.spawnChance)||0),0);
  if(total<=0) return cards[Math.floor(Math.random()*cards.length)];

  let value=Math.random()*total;

  for(const card of cards){
    value-=Math.max(0,Number(card.spawnChance)||0);
    if(value<=0) return card;
  }

  return cards[cards.length-1];
}

/*
  Erste lokale Version:
  Geister erscheinen in einem kleinen Bereich
  um den aktuellen Standort.
  Ihre Positionen werden hier lokal erzeugt.
  Die spätere gemeinsame Weltverteilung benötigt
  eine zentrale Datenquelle.
*/
function loadNearbyGhosts(){
  if(!playerPosition || cards.length===0) return;

  const key=
    Math.round(playerPosition.lat*10000)+":"+
    Math.round(playerPosition.lng*10000);

  if(key===lastSpawnKey) return;
  lastSpawnKey=key;

  ghosts.forEach(g=>{
    if(g.marker) map.removeLayer(g.marker);
  });
  ghosts=[];

  const count=5;

  for(let i=0;i<count;i++){
    const card=weightedCard();

    // Kleine visuelle Streuung um den aktuellen Standort.
    // Alle Begegnungen bleiben im 20-Meter-Radius.
    const angle=Math.random()*Math.PI*2;
    const distance=Math.random()*8;

    const lat=playerPosition.lat+
      Math.cos(angle)*distance/111320;

    const lng=playerPosition.lng+
      Math.sin(angle)*distance/
      (111320*Math.max(.1,Math.cos(playerPosition.lat*Math.PI/180)));

    const ghost={
      instanceId:"ghost_"+Date.now()+"_"+i+"_"+Math.random(),
      card,
      lat,
      lng,
      collected:false,
      marker:null
    };

    const icon=L.divIcon({
      className:"",
      html:'<div class="ghostMarker">👻</div>',
      iconSize:[42,42],
      iconAnchor:[21,21]
    });

    ghost.marker=L.marker([lat,lng],{icon}).addTo(map);

    ghost.marker.on("click",()=>openGhost(ghost));

    ghosts.push(ghost);
  }
}

function distanceMeters(lat1,lon1,lat2,lon2){
  const R=6371000;
  const rad=x=>x*Math.PI/180;

  const dLat=rad(lat2-lat1);
  const dLon=rad(lon2-lon1);

  const a=
    Math.sin(dLat/2)**2+
    Math.cos(rad(lat1))*
    Math.cos(rad(lat2))*
    Math.sin(dLon/2)**2;

  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function openGhost(ghost){
  if(!playerPosition){
    toast("Standort noch nicht verfügbar");
    return;
  }

  selectedGhost=ghost;

  const distance=distanceMeters(
    playerPosition.lat,
    playerPosition.lng,
    ghost.lat,
    ghost.lng
  );

  const already=getCollection().some(
    item=>item.id===ghost.card.id
  );

  document.getElementById("modalArt").textContent=ghost.card.emoji||"👻";
  document.getElementById("modalName").textContent=ghost.card.name;
  document.getElementById("modalRarity").textContent=ghost.card.rarity;
  document.getElementById("modalRarity").className=
    "rarity "+(rarityClass[ghost.card.rarity]||"common");

  document.getElementById("modalDescription").textContent=
    ghost.card.description||"Ein geheimnisvoller Geist.";

  document.getElementById("distanceText").textContent=
    "Entfernung: "+Math.round(distance)+" Meter";

  const button=document.getElementById("collectButton");

  if(already){
    button.textContent="BEREITS GESAMMELT";
    button.disabled=true;
    button.style.opacity=".5";
  }else if(distance>20){
    button.textContent="ZU WEIT ENTFERNT";
    button.disabled=true;
    button.style.opacity=".5";
  }else{
    button.textContent="GEIST SAMMELN";
    button.disabled=false;
    button.style.opacity="1";
  }

  document.getElementById("ghostModal").style.display="flex";
}

function closeGhost(){
  document.getElementById("ghostModal").style.display="none";
  selectedGhost=null;
}

function collectGhost(){
  if(!selectedGhost||!playerPosition) return;

  const distance=distanceMeters(
    playerPosition.lat,
    playerPosition.lng,
    selectedGhost.lat,
    selectedGhost.lng
  );

  if(distance>20){
    toast("Du bist zu weit entfernt!");
    closeGhost();
    return;
  }

  const collection=getCollection();

  if(collection.some(c=>c.id===selectedGhost.card.id)){
    toast("Diesen Geist besitzt du bereits!");
    closeGhost();
    return;
  }

  collection.push({
    id:selectedGhost.card.id,
    collectedAt:new Date().toISOString()
  });

  saveCollection(collection);

  if(selectedGhost.marker){
    map.removeLayer(selectedGhost.marker);
  }

  ghosts=ghosts.filter(g=>g!==selectedGhost);

  const name=selectedGhost.card.name;
  closeGhost();
  toast("✨ "+name+" wurde gesammelt!");
}

/* Navigation */
function showPage(page){
  currentPage=page;

  document.getElementById("mapNav").classList.toggle("active",page==="map");
  document.getElementById("collectionNav").classList.toggle("active",page==="collection");

  if(page==="collection"){
    renderCollection();
    document.getElementById("panelTitle").textContent="Deine Sammlung";
    document.getElementById("panel").style.display="flex";
  }else{
    closePanel();
    setTimeout(()=>{if(map)map.invalidateSize()},100);
  }
}

function closePanel(){
  document.getElementById("panel").style.display="none";
  currentPage="map";
  document.getElementById("mapNav").classList.add("active");
  document.getElementById("collectionNav").classList.remove("active");
}

function renderCollection(){
  const grid=document.getElementById("collectionGrid");
  const collection=getCollection();

  grid.innerHTML="";

  if(collection.length===0){
    grid.innerHTML=`
      <div id="empty">
        <div style="font-size:55px">👻</div>
        <h3>Noch keine Geister!</h3>
        <p>Entdecke Geister auf der Karte und sammle sie.</p>
      </div>`;
    return;
  }

  collection.forEach(item=>{
    const card=cards.find(c=>c.id===item.id);
    if(!card)return;

    const div=document.createElement("div");
    div.className="card";

    const art=document.createElement("div");
    art.className="cardArt";
    art.textContent=card.emoji||"👻";

    const name=document.createElement("div");
    name.className="cardName";
    name.textContent=card.name;

    const rarity=document.createElement("div");
    rarity.className="rarity "+(rarityClass[card.rarity]||"common");
    rarity.textContent=card.rarity;

    div.append(art,name,rarity);
    grid.appendChild(div);
  });
}

function centerPlayer(){
  if(!playerPosition){
    toast("Noch kein GPS-Standort verfügbar");
    return;
  }

  map.setView(
    [playerPosition.lat,playerPosition.lng],
    18,
    {animate:true}
  );
}

window.addEventListener("beforeunload",()=>{
  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
  }
});
</script>

</body>
</html>
