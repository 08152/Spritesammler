
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SkyCards</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #eef7ff;
  color: #172c49;
}

button {
  border: 0;
  cursor: pointer;
  font: inherit;
  touch-action: manipulation;
}

#startScreen {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #ffffff, #dceeff);
}

#startButton {
  padding: 22px 65px;
  border-radius: 22px;
  color: white;
  background: linear-gradient(135deg, #55baff, #287be8);
  font-size: 25px;
  font-weight: 800;
  box-shadow: 0 12px 30px #287be844;
  transition: transform .2s, box-shadow .2s;
}

#startButton:active {
  transform: scale(.94);
  box-shadow: 0 4px 12px #287be833;
}

#game {
  display: none;
  position: fixed;
  inset: 0;
}

#map {
  position: absolute;
  inset: 0;
  background: #dceeff;
}

/* Verhindert manuelles Verschieben und Zoomen */
.leaflet-container {
  touch-action: none;
  cursor: default !important;
}

.leaflet-control-container {
  display: none;
}

.leaflet-pane,
.leaflet-marker-pane {
  pointer-events: none;
}

.leaflet-marker-icon {
  pointer-events: auto;
}

#libraryButton {
  position: absolute;
  z-index: 1000;
  right: 20px;
  bottom: 22px;
  width: 66px;
  height: 66px;
  border-radius: 22px;
  color: #2378db;
  background: rgba(255,255,255,.96);
  box-shadow: 0 5px 25px #153c6528;
  font-size: 28px;
  transition: transform .2s;
}

#libraryButton:active {
  transform: scale(.9);
}

.playerIcon {
  width: 24px;
  height: 24px;
  border: 4px solid white;
  border-radius: 50%;
  background: #2587ff;
  box-shadow: 0 0 0 8px #2587ff30, 0 2px 8px #0003;
}

.questionMarker {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 17px;
  color: white;
  background: linear-gradient(145deg, #68c5ff, #2478ed);
  border: 3px solid white;
  box-shadow: 0 5px 18px #2378db55;
  font-size: 28px;
  font-weight: 900;
  animation: questionFloat 1.8s ease-in-out infinite;
}

@keyframes questionFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-5px) scale(1.05); }
}

#libraryScreen,
#rewardScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: linear-gradient(145deg, #fafdff, #e5f2ff);
}

#libraryHeader {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

#libraryHeader button,
#rewardBack {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  color: #287be8;
  background: white;
  box-shadow: 0 3px 12px #17477c15;
  font-size: 24px;
}

#collection {
  height: calc(100% - 76px);
  overflow-y: auto;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
  align-content: start;
  gap: 15px;
}

.card {
  aspect-ratio: 3 / 4.2;
  border-radius: 17px;
  overflow: hidden;
  position: relative;
  background: linear-gradient(145deg, #cce9ff, #76baff);
  box-shadow: 0 5px 15px #245d941c;
  animation: cardAppear .35s ease both;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cardName {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 7px;
  color: white;
  text-align: center;
  font-size: 14px;
  font-weight: 800;
  background: linear-gradient(transparent, #112b50dd);
}

#rewardScreen {
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 25px;
}

#rewardCard {
  width: min(72vw, 300px);
  aspect-ratio: 3 / 4.2;
  border-radius: 24px;
  overflow: hidden;
  position: relative;
  background: linear-gradient(145deg, #cce9ff, #76baff);
  box-shadow: 0 18px 50px #1a5aa43b;
  animation: rewardReveal .55s cubic-bezier(.2,.8,.2,1) both;
}

#rewardCard img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#rewardName {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 20px 8px;
  color: white;
  text-align: center;
  font-weight: 900;
  font-size: 22px;
  background: linear-gradient(transparent, #112b50ed);
}

#rewardBack {
  width: auto;
  min-width: 160px;
  padding: 0 24px;
  font-size: 16px;
  font-weight: 800;
}

@keyframes cardAppear {
  from { opacity: 0; transform: translateY(10px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes rewardReveal {
  from { opacity: 0; transform: scale(.65) rotate(-7deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}
</style>
</head>

<body>
<div id="startScreen">
  <button id="startButton">STARTEN</button>
</div>

<div id="game">
  <div id="map"></div>
  <button id="libraryButton" aria-label="Bibliothek öffnen">▤</button>
</div>

<div id="libraryScreen">
  <div id="libraryHeader">
    <button id="libraryBack" aria-label="Zurück">‹</button>
    <strong>Bibliothek</strong>
    <div style="width:46px"></div>
  </div>
  <div id="collection"></div>
</div>

<div id="rewardScreen">
  <div id="rewardCard">
    <img id="rewardImage" alt="">
    <div id="rewardName"></div>
  </div>
  <button id="rewardBack">Weiter</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const game = document.getElementById("game");
const libraryButton = document.getElementById("libraryButton");
const libraryScreen = document.getElementById("libraryScreen");
const libraryBack = document.getElementById("libraryBack");
const collection = document.getElementById("collection");
const rewardScreen = document.getElementById("rewardScreen");
const rewardBack = document.getElementById("rewardBack");

let map;
let playerMarker;
let accuracyCircle;
let gpsWatch = null;
let playerPosition = null;
let questionMarkers = [];
let collected = new Set();
let cardPool = [];
let active = false;
let lastSpawn = 0;

const playerIcon = L.divIcon({
  className: "",
  html: '<div class="playerIcon"></div>',
  iconSize: [24, 24],
  iconAnchor: [12, 12]
});

function createMap(lat, lon) {
  map = L.map("map", {
    zoomControl: false,
    attributionControl: false,
    dragging: false,
    touchZoom: false,
    doubleClickZoom: false,
    scrollWheelZoom: false,
    boxZoom: false,
    keyboard: false,
    tap: false,
    zoomSnap: 0.5
  }).setView([lat, lon], 18);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 20
  }).addTo(map);

  playerMarker = L.marker([lat, lon], {
    icon: playerIcon,
    interactive: false,
    keyboard: false
  }).addTo(map);

  accuracyCircle = L.circle([lat, lon], {
    radius: 10,
    color: "#2587ff",
    weight: 1,
    fillColor: "#2587ff",
    fillOpacity: 0.1,
    interactive: false
  }).addTo(map);

  map.on("drag", () => {
    if (playerPosition) map.panTo(playerPosition, { animate: false });
  });
}

async function loadCards() {
  try {
    const response = await fetch("cards.json", { cache: "no-store" });
    if (!response.ok) return [];
    const data = await response.json();
    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function startGame() {
  if (!navigator.geolocation) return;

  startScreen.style.display = "none";
  game.style.display = "block";
  active = true;

  if (map) {
    map.invalidateSize();
  }

  navigator.geolocation.getCurrentPosition(
    position => {
      updatePosition(position);
      if (!map) {
        createMap(
          position.coords.latitude,
          position.coords.longitude
        );
      } else {
        map.invalidateSize();
        map.setView(playerPosition, 18, { animate: false });
      }

      if (gpsWatch === null) {
        gpsWatch = navigator.geolocation.watchPosition(
          updatePosition,
          () => {},
          {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 20000
          }
        );
      }
    },
    () => {
      active = false;
      startScreen.style.display = "flex";
      game.style.display = "none";
    },
    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 20000
    }
  );
}

function updatePosition(position) {
  if (!active) return;

  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  playerPosition = L.latLng(lat, lon);

  if (!map) {
    createMap(lat, lon);
    return;
  }

  playerMarker.setLatLng(playerPosition);
  accuracyCircle.setLatLng(playerPosition);
  accuracyCircle.setRadius(
    Math.max(5, position.coords.accuracy || 10)
  );

  // Die Karte folgt der GPS-Position, ohne manuelle Steuerung.
  map.setView(playerPosition, map.getZoom(), { animate: false });

  maybeSpawnQuestion();
  refreshQuestionDistances();
}

function distanceMeters(a, b) {
  return map.distance(a, b);
}

function maybeSpawnQuestion() {
  if (!playerPosition || !map || cardPool.length === 0) return;

  const now = Date.now();

  // Gelegentlich eine neue Frage in der näheren Umgebung.
  if (now - lastSpawn < 45000) return;
  if (questionMarkers.length >= 3) return;
  if (Math.random() > 0.35) return;

  lastSpawn = now;

  const angle = Math.random() * Math.PI * 2;
  const distance = 25 + Math.random() * 45;
  const latOffset = (distance * Math.cos(angle)) / 111320;
  const lonOffset =
    (distance * Math.sin(angle)) /
    (111320 * Math.cos(playerPosition.lat * Math.PI / 180));

  const location = L.latLng(
    playerPosition.lat + latOffset,
    playerPosition.lng + lonOffset
  );

  const icon = L.divIcon({
    className: "",
    html: '<div class="questionMarker">?</div>',
    iconSize: [48, 48],
    iconAnchor: [24, 24]
  });

  const marker = L.marker(location, {
    icon,
    keyboard: false,
    riseOnHover: true
  }).addTo(map);

  const item = { marker, location };
  questionMarkers.push(item);

  marker.on("click", () => {
    if (!playerPosition) return;

    if (distanceMeters(playerPosition, location) <= 20) {
      collectQuestion(item);
    }
  });
}

function refreshQuestionDistances() {
  // Fragezeichen bleiben sichtbar; die Entfernung wird beim Antippen geprüft.
}

function collectQuestion(item) {
  if (!playerPosition || distanceMeters(playerPosition, item.location) > 20) {
    return;
  }

  map.removeLayer(item.marker);
  questionMarkers = questionMarkers.filter(q => q !== item);

  const available = cardPool.filter(card => {
    const id = card.id || card.name;
    return id && !collected.has(id);
  });

  if (available.length === 0) return;

  const card = available[Math.floor(Math.random() * available.length)];
  const id = card.id || card.name;
  collected.add(id);

  document.getElementById("rewardImage").src = card.image || "";
  document.getElementById("rewardImage").style.display =
    card.image ? "block" : "none";
  document.getElementById("rewardName").textContent = card.name || "";
  rewardScreen.style.display = "flex";
  rewardScreen.style.pointerEvents = "auto";
  game.style.display = "none";
}

function openLibrary() {
  game.style.display = "none";
  libraryScreen.style.display = "block";
  renderCollection();
}

function renderCollection() {
  collection.innerHTML = "";

  cardPool
    .filter(card => collected.has(card.id || card.name))
    .forEach(card => {
      const element = document.createElement("div");
      element.className = "card";

      if (card.image) {
        const image = document.createElement("img");
        image.src = card.image;
        image.alt = "";
        element.appendChild(image);
      }

      const name = document.createElement("div");
      name.className = "cardName";
      name.textContent = card.name || "";
      element.appendChild(name);

      collection.appendChild(element);
    });
}

function returnToMap() {
  rewardScreen.style.display = "none";
  libraryScreen.style.display = "none";
  game.style.display = "block";

  if (map) {
    map.invalidateSize();
    if (playerPosition) {
      map.setView(playerPosition, map.getZoom(), { animate: false });
    }
  }
}

startButton.addEventListener("click", startGame);
libraryButton.addEventListener("click", openLibrary);
libraryBack.addEventListener("click", returnToMap);
rewardBack.addEventListener("click", returnToMap);

loadCards().then(cards => {
  cardPool = cards;
});
</script>
</body>
</html>
