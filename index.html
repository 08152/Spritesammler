
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Million Coins</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
}

.background {
    position: absolute;
    inset: 0;
    background: url("backround.png") center/cover no-repeat;
    animation: backgroundMove 15s ease-in-out infinite alternate;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
}

.content {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.start-button {
    padding: 20px 85px;
    border: 2px solid #ffe29a;
    border-radius: 12px;
    background: linear-gradient(135deg, #ffda73, #d99a22);
    color: #382300;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow: 0 8px 35px rgba(255,185,40,0.35);
    transition: 0.25s ease;
}

.start-button:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 45px rgba(255,185,40,0.6);
}

.start-button:active {
    transform: scale(0.96);
}

@keyframes backgroundMove {
    from { transform: scale(1.03); }
    to { transform: scale(1.10); }
}
</style>
</head>
<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="content">
    <button class="start-button" onclick="location.href='game.html'">
        START
    </button>
</div>

</body>
</html>
